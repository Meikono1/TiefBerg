# Pflanzen (lore/pflanzen.md Abschnitt 6 und 7, Verfahren lore/welt_konfiguration.md Abschnitt 12).
# Eingabe von tools/pflanzen.py und zugleich Metadaten fürs Spiel. Liste noch nicht bestätigt (T-050).
#
# Felder (Abbildung der Standort-Angaben nach pflanzen.md Abschnitt 2, O - Vorschlag):
#   growth        Wuchsform (pflanzen.md Abschnitt 2)
#   climate       Köppen-Code → Gewicht (Kernzone 1, Randzone ergibt sich im Werkzeug) oder → Bedingungen nur in dieser
#                 Klasse: { weight, water: [...], elevation_m: [von, bis], coast_km: N }. „(Rand)“, „(warm)“ → 0.5,
#                 „(Gebirge)“, „(Hochland)“, „(Hang)“ → ab 1000 m, „(Hochgebirge)“ → ab 2500 m, „(küstennah)“ → coast_km.
#   water         Wasserkategorien (pflanzen.md Abschnitt 3). Ohne Angabe in der Liste: FRISCH und FEUCHT.
#                 „TROCKEN toleriert“ → TROCKEN und FRISCH; Pflanzen aus Abschnitt 6.14 haben zusätzlich OASE.
#   soil          prefer / tolerate / only / exclude (Boden-IDs aus boeden.yaml). Kalk → rendzina, terra_rossa,
#                 kalkkruste und ph [NEUTRAL, BASISCH]; Fels → rohboden_fels; Moor → moor; Überschwemmungsflächen → auenboden.
#   fertility     FRUCHTBAR („fruchtbar, nährstoffreich“) oder ARM („arm“, „auch arme Böden“)
#   ph            [von, bis] aus STARK_SAUER, SAUER, SCHWACH_SAUER, NEUTRAL, BASISCH; „sauer“ → [STARK_SAUER, SCHWACH_SAUER]
#   salt_tolerant true: wächst auch auf Salzboden
#   terrain       HANG („Hang“);  drainage: GUT („gut drainiert“ → kein Gley, kein Moor)
#   frost_free    true: kältester Monat über 0 °C;  island_bonus: true („bevorzugt Inseln“)
#   homeland      Regionen (lore/regionen.yaml), in denen die Pflanze von Natur aus wächst; sonst worldwide: true
#                 (Grundflora, die niemand handelt). Genau eins von beiden. Anbau außerhalb der Heimat ist Sache der
#                 Simulation (Design-Referenz Abschnitt 9), nicht dieser Ebene. Zuordnung Entwurf 2026-10-25 (T-091).
#   line          true: eigene Variante je Region der Verbreitung, Layer <id>_<region>
#   shade, fire_pioneer, fog   Schatten/Unterholz, Pionier auf Brandflächen, Nebel: im Werkzeug noch nicht wirksam (TODO)
#   use           Nutzungscodes (pflanzen.md Abschnitt 4)
#   fictional     true für erfundene Pflanzen (Abschnitt 7); active: false, solange sie nicht freigegeben sind

