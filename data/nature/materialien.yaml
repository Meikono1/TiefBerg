# Materialien (lore/materialien_und_boeden.md Abschnitt 5, Verfahren lore/welt_konfiguration.md Abschnitt 10).
# Eingabe von tools/gestein.py (Kategorie GESTEIN, rule.kind share/occurrence) und tools/lagerstaetten.py (Abschnitte
# 5.2–5.6, rule.kind deposit) und zugleich Metadaten fürs Spiel.
#
# rarity: Zielklasse (Zielwerte, Design-Referenz Abschnitt 4), target_cover in rarity_classes.
# rule.kind:
#   share       Anteil am Grundgestein aus rock_shares; Layer = Anteil (Summe aller Anteile je Landzelle 255)
#   occurrence  Vorkommen; Layer 0–255, 255 = ergiebigste Stelle. Eignung = rooms (Gewicht je Gesteinsraum)
#               × source (Anteil bzw. Wert eines anderen Layers, ab min_source) × Rauschen der distribution,
#               danach Schwellwert so, dass die Abdeckung target_cover trifft.
#   deposit     Lagerstätte (tools/lagerstaetten.py); Eignung = Produkt aller Bedingungen, je 0–1 pro Zelle:
#                 rooms {RAUM: Gewicht}        weiches Gewicht der Gesteinsräume (Summe)
#                 source / sources, combine    Wert anderer Layer (Gestein oder Lagerstätte) ab min_source (presence: true
#                                              = nur ob vorhanden, Faktor 1);
#                                              combine any = größter, all = kleinster Wert (beide nötig)
#                 koeppen [Klassen]            nur in diesen Köppen-Klassen; exclude_koeppen: nicht in diesen
#                 soils [Böden]                Summe der Bodenanteile aus boeden.bin
#                 wetland: true                Feuchtgebietsanteil aus bodenfeuchte.bin
#                 flat: true                   flaches Gelände (Faktor fällt bis 0,4 % Gefälle auf 0)
#                 coast_km / lakes_km          höchstens so weit vom Meer bzw. von einem Binnengewässer
#                 rivers: true                 im Streifen ganzjähriger Flüsse
#                 near_rooms {RAUM: km}        höchstens so weit von einem dieser Gesteinsräume
#                 min_elevation_m / max_elevation_m   Höhe
#                 chains [Ketten], chain_km    höchstens so weit von diesen Ketten aus lore/gesteinsraeume.yaml
#                 weight                       fester Faktor
#                 any_of [Bedingungen]         größter Wert der Teilbedingungen (oder)
#               Dazu: sites N (PUNKTUELL: genau N Fundorte statt Abdeckung), sites_per_landmass K (davon zuerst K auf
#               jedem Festland), placer: true (PUNKTUELL mit Seife).
#               Verteilung SEIFE: Quelle flussabwärts angereichert (tools/seifen.py).

rarity_classes:   # Zielabdeckung in % der Landfläche (O - Vorschlag: geometrische Mitte der Klasse)
  SEHR_HAEUFIG: 30.0
  HAEUFIG: 10.0
  MITTEL: 2.2
  SELTEN: 0.3
  SEHR_SELTEN: 0.03
  EXTREM_SELTEN: 0.005

# Gesteinsanteile je Gesteinsraum in Prozent (Abschnitt 3). Travertin ist ein punktuelles Vorkommen (Abschnitt 5.1),
# sein Anteil im GRABEN ist Tonstein zugeschlagen.
